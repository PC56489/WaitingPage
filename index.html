<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Busy</title>
    <style>
        body{
            background-color: black;
            color: aliceblue;
            width: 100vw;
            height: 100vh;
        }
        .dvd{
            position: absolute;
            top: 50%;
            left: 50%;
            user-select: none;
            pointer-events: none;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: red;
            animation: dvdMove 5s linear infinite;
        }
        .midbox{
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="dvd" id="dvd">DVD</div>
    <header>
        <div class="logo">NETFLIX</div>
    </header>
    <div class="midbox">
        <div class="spinner"></div>
        <div class="midtext">
            <h1>伺服器忙線中</h1>
            <p>目前有太多使用者正在觀看。<br>請稍候片刻，我們很快就會回來。<br>正在重新連線...</p>
        </div>
    </div>
</body>
</html>
