<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Busy</title>
    <style>
        body{
            background-color: black;
            color: aliceblue;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .dvd-pic{
            position: absolute;
            top: 50%;
            left: 20%;
            color: red;
            width: 110px;
            height: auto;
        }
        .midbox{
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            pointer-events: none
        }
        .logo{
            position: absolute;
            font-size: clamp(25px, 4vw, 38px);
            font-weight: bold;
            color: red;
            user-select: none;
        }
        .spinner {
            width: 42px;
            height: 42px;
            margin: 0 auto 24px;
            border: 4px solid #ffffff25;
            border-top-color: #e50914;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="dvd">
        <svg class="dvd-pic" xmlns="http://www.w3.org/2000/svg" width="2500" height="2500" viewBox="0 0 192.756 192.756">
            <defs>
                <filter id="dvd-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur2" />
                    <feMerge>
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>
            </defs>
            <g fill-rule="evenodd" clip-rule="evenodd" filter="url(#dvd-glow)">
                <path fill="currentColor" d="M88.033 129.504c-11.207 0-20.187-1.895-20.187-4.205 0-2.309 8.98-4.201 20.187-4.201 11.123 0 20.109 1.893 20.109 4.201.001 2.31-8.986 4.205-20.109 4.205zm21.342-59.988S96.521 85.009 97.178 85.995c.914-.986-4.615-16.646-4.615-16.646s-1.153-3.296-4.773-14.086H74.686v-.085l-31.803.085H18.901l-2.394 10.132H38.845c11.613 0 18.704 4.697 16.723 13.021-2.139 9.064-12.275 12.936-23.072 12.936h-4.038l5.192-22.166H15.602l-7.663 32.379h25.628c19.281 0 37.572-10.132 40.872-23.149.577-2.391.496-8.407-.987-11.95 0-.084-.084-.247-.167-.492-.081-.084-.166-.661.167-.746.162-.081.492.248.492.333 0 0 .166.414.329.743l16.313 46.059 41.537-46.886 17.549-.082h4.285c11.621 0 18.789 4.697 16.809 13.021-2.145 9.064-12.355 12.936-23.152 12.936h-4.123l5.275-22.166h-18.047l-7.664 32.379h25.631c19.279 0 37.734-10.132 40.785-23.149 3.131-13.021-10.383-23.153-29.83-23.153H121.408c-10.133 11.943-12.033 14.253-12.033 14.253zM2.835 125.055c0 6.918 39.552 12.523 88.328 12.523 48.864 0 88.423-5.605 88.423-12.523 0-6.924-39.559-12.525-88.423-12.525-48.776-.001-88.328 5.601-88.328 12.525zm169.989 9.966v-.33h-1.977l-.082.33h.824l-.332 2.557h.414l.328-2.557h.825zm2.965 2.557v-2.887h-.33l-1.07 1.98-.488-1.98h-.33l-.912 2.887h.336l.736-2.225.498 2.225 1.154-2.225h.076v2.225h.33z"/>
            </g>
        </svg>
    </div>
    <header>
        <div class="logo">NETFLIX</div>
    </header>
    <div class="midbox">
        <div class="spinner"></div>
        <div class="midtext">
            <h1>伺服器忙線中</h1>
            <p>目前有太多使用者正在觀看。<br>請稍候片刻，我們很快就會回來。<br>正在重新連線...</p>
        </div>
    </div>
</body>
</html>
